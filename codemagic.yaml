workflows:
  whatsapp_status_vault_android:
    name: WhatsApp Status Vault Android
    max_build_duration: 60

    environment:
      android_signing:
        - paliaapk-release
      java: 17

    scripts:

      - name: Check project
        script: |
          set -e

          echo "Checking Android project..."

          test -d app
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          test -f gradlew

          chmod +x gradlew

          echo "Project OK"

      - name: Check Gradle
        script: |
          set -e

          ./gradlew --version

      - name: Clean project
        script: |
          set -e

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            clean

      - name: Build signed release APK
        script: |
          set -e

          echo "Building WhatsApp Status Vault..."

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            assembleRelease

          echo "Searching for APK..."

          find app/build/outputs -type f -name "*.apk" -print

      - name: Prepare APK
        script: |
          set -e

          APK_DIR="app/build/outputs/apk/release"
          APK="$APK_DIR/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."

            echo "Available files:"
            find app/build/outputs -type f -print

            exit 1
          fi

          cp "$APK" "$APK_DIR/WhatsApp-Status-Vault.apk"

          echo "Final APK:"
          ls -lh "$APK_DIR/WhatsApp-Status-Vault.apk"

    artifacts:
      - app/build/outputs/apk/release/WhatsApp-Status-Vault.apk
